<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechnoCIT Interactive Avatar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated background elements */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(120, 219, 255, 0.2) 0%, transparent 50%);
      animation: backgroundShift 20s ease-in-out infinite;
    }

    @keyframes backgroundShift {
      0%, 100% { transform: translateX(0) translateY(0); }
      25% { transform: translateX(-20px) translateY(-10px); }
      50% { transform: translateX(20px) translateY(10px); }
      75% { transform: translateX(-10px) translateY(20px); }
    }

    .header {
      position: fixed;
      top: 30px;
      left: 30px;
      z-index: 10000;
      animation: slideInLeft 1s ease-out;
    }

    .logo {
      width: 140px;
      height: auto;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
      transition: transform 0.3s ease;
    }

    .logo:hover {
      transform: scale(1.05);
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      z-index: 10;
      padding-top: 120px;
    }

    .welcome-text {
      text-align: center;
      margin-bottom: 60px;
      color: white;
      animation: fadeInUp 1s ease-out 0.5s both;
      max-width: 800px;
    }

    .welcome-text h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 15px;
      text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      background: linear-gradient(45deg, #fff, #f0f8ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .welcome-text p {
      font-size: 1.2rem;
      opacity: 0.9;
      max-width: 600px;
      line-height: 1.6;
    }

    .avatar-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeInUp 1s ease-out 1s both;
      margin-top: 40px;
    }

    .avatar-glow {
      position: absolute;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
      animation: pulse 3s ease-in-out infinite;
    }

    .start-button {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(45deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
      transition: all 0.3s ease;
      z-index: 1000;
    }

    .start-button:hover {
      transform: translateX(-50%) translateY(-2px);
      box-shadow: 0 12px 35px rgba(102, 126, 234, 0.4);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }

    @keyframes slideInLeft {
      from { transform: translateX(-100px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes fadeInUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Responsive design */
    @media (max-width: 768px) {
      .welcome-text h1 {
        font-size: 2rem;
      }
      
      .welcome-text p {
        font-size: 1rem;
      }
      
      .header {
        top: 20px;
        left: 20px;
      }
      
      .logo {
        width: 100px;
      }
    }

    @media (max-width: 480px) {
      .welcome-text h1 {
        font-size: 1.5rem;
      }
      
      .main-container {
        padding: 15px;
      }
    }
  </style>
</head>

<body>
  <!-- 🔹 TechnoCIT Logo Section -->
  <div class="header">
    <img src="https://technocit.com/wp-content/uploads/2024/05/Logo.svg"
         alt="TechnoCIT Logo"
         class="logo">
  </div>

  <!-- 🔹 Main Content -->
  <div class="main-container">
    <div class="welcome-text">
      <h1>Welcome to TechnoCIT</h1>
      <p>Meet our AI Avatar - Your intelligent assistant ready to help you with any questions or support you need.</p>
    </div>
    
    <div class="avatar-container">
      <div class="avatar-glow"></div>
    </div>
    
    <button class="start-button" onclick="startAvatar()">
      Start Chat with AI Avatar
    </button>
  </div>

  <!-- Close Avatar Button -->
  <button class="close-avatar" id="close-avatar" onclick="closeAvatar()">
    ×
  </button>

  <!-- 🔹 Start Avatar Function -->
  <script>
    function startAvatar() {
      // Hide the welcome content but keep logo visible
      const mainContainer = document.querySelector('.main-container');
      const header = document.querySelector('.header');
      
      if (mainContainer) {
        mainContainer.style.opacity = '0';
        mainContainer.style.transform = 'translateY(-50px)';
        mainContainer.style.transition = 'all 0.5s ease';
      }
      
      // Keep the logo visible - don't hide the header
      if (header) {
        header.style.opacity = '1';
        header.style.transform = 'translateX(0)';
        header.style.transition = 'all 0.5s ease';
      }
      
      // Show the avatar
      const avatar = document.getElementById('heygen-streaming-embed');
      if (avatar) {
        avatar.classList.add('show');
        // Trigger expand after a short delay
        setTimeout(() => {
          avatar.classList.add('expand');
          // Show close button
          const closeBtn = document.getElementById('close-avatar');
          if (closeBtn) {
            closeBtn.classList.add('show');
          }
        }, 1000);
      }
    }

    function closeAvatar() {
      // Show the welcome content again
      const mainContainer = document.querySelector('.main-container');
      const header = document.querySelector('.header');
      
      if (mainContainer) {
        mainContainer.style.opacity = '1';
        mainContainer.style.transform = 'translateY(0)';
      }
      
      // Logo stays visible, just ensure it's properly positioned
      if (header) {
        header.style.opacity = '1';
        header.style.transform = 'translateX(0)';
      }
      
      // Hide the avatar
      const avatar = document.getElementById('heygen-streaming-embed');
      if (avatar) {
        avatar.classList.remove('expand', 'show');
      }
      
      // Hide close button
      const closeBtn = document.getElementById('close-avatar');
      if (closeBtn) {
        closeBtn.classList.remove('show');
      }
    }
  </script>

  <!-- 🔹 HeyGen Interactive Avatar Script -->

        #heygen-streaming-embed.expand {

        .close-avatar {

          color: white;
          border: none;
          width: 50px;

          z-index: 100000;

        .close-avatar:hover {

        @keyframes avatarAppear {
          from {

      `;
      const iframe=document.createElement("iframe");
      iframe.allowFullscreen=!1;
      iframe.title="Streaming Embed";
      iframe.role="dialog";
      iframe.allow="microphone";
      iframe.src=url;
      let visible=!1,initial=!1;
      window.addEventListener("message",(e)=>{
        if(e.origin===host&&e.data&&e.data.type==="streaming-embed"){
          if(e.data.action==="init"){initial=!0;wrapDiv.classList.toggle("show",initial);}
          else if(e.data.action==="show"){visible=!0;wrapDiv.classList.toggle("expand",visible);}
          else if(e.data.action==="hide"){visible=!1;wrapDiv.classList.toggle("expand",visible);}

      container.appendChild(iframe);
      wrapDiv.appendChild(stylesheet);
      wrapDiv.appendChild(container);
      document.body.appendChild(wrapDiv);
    }(globalThis);
  </script>

</body>
</html>
